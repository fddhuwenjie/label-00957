version: '3.8'

services:
  # 用户端 - 多端合一响应式
  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    volumes:
      - ./frontend-user:/var/www/html
      - user_vendor:/var/www/html/vendor
      - shared_uploads:/var/www/html/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=music_platform
      - DB_USERNAME=root
      - DB_PASSWORD=root123
      - ADMIN_URL=http://localhost:8082
    networks:
      - music-network
    restart: unless-stopped

  # 后台管理端
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    volumes:
      - ./frontend-admin:/var/www/html
      - admin_vendor:/var/www/html/vendor
      - shared_uploads:/var/www/html/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=music_platform
      - DB_USERNAME=root
      - DB_PASSWORD=root123
    networks:
      - music-network
    restart: unless-stopped

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    platform: linux/amd64
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: music_platform
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - music-network
    restart: unless-stopped

networks:
  music-network:
    driver: bridge

volumes:
  mysql_data:
  shared_uploads:
  user_vendor:
  admin_vendor:
