name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  php-unit-tests:
    name: PHP Unit Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: music_platform_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, mysqli, gd, zip, redis
          coverage: xdebug

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        working-directory: ./frontend-user
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Copy environment file
        working-directory: ./frontend-user
        run: cp .env.example .env

      - name: Configure database for testing
        working-directory: ./frontend-user
        run: |
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=3306/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=music_platform/DB_DATABASE=music_platform_test/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=root/DB_PASSWORD=root123/' .env

      - name: Run PHPUnit tests
        working-directory: ./frontend-user
        run: composer test -- --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-coverage-report
          path: frontend-user/coverage.xml

  php-codesniffer:
    name: PHP CodeSniffer (PSR-12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, tokenizer
          tools: phpcs

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        working-directory: ./frontend-user
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Run PHP CodeSniffer
        working-directory: ./frontend-user
        run: composer cs:check

      - name: Generate CodeSniffer report
        if: failure()
        working-directory: ./frontend-user
        run: phpcs --standard=PSR12 --report=full app/ tests/ > phpcs-report.txt

      - name: Upload CodeSniffer report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: phpcs-report
          path: frontend-user/phpcs-report.txt

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify static assets exist
        run: |
          echo "Checking frontend assets..."
          ls -la frontend-user/public/assets/css/
          ls -la frontend-user/public/assets/js/
          ls -la frontend-user/public/assets/images/

      - name: Validate CSS files
        run: |
          echo "Validating CSS files..."
          find frontend-user/public/assets/css -name "*.css" -exec echo "Found: {}" \;

      - name: Validate JavaScript files
        run: |
          echo "Validating JavaScript files..."
          find frontend-user/public/assets/js -name "*.js" -exec echo "Found: {}" \;

      - name: Check for minified assets
        run: |
          echo "Checking asset structure..."
          if [ -d "frontend-user/public/assets" ]; then
            echo "✓ Assets directory exists"
          else
            echo "✗ Assets directory missing"
            exit 1
          fi

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: frontend-user/public/assets/

  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [php-unit-tests, php-codesniffer, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push Docker image (frontend-user)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-user
          file: ./frontend-user/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-user:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (frontend-admin)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-admin
          file: ./frontend-admin/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-admin:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "Frontend User image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-user:${{ github.sha }}"
          echo "Frontend Admin image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-admin:${{ github.sha }}"
