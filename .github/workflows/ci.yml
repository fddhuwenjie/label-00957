name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_USER: ${{ github.repository }}/frontend-user
  IMAGE_NAME_ADMIN: ${{ github.repository }}/frontend-admin

jobs:
  php-unit-test:
    name: PHP Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-user
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, json, zip, gd
          coverage: xdebug
          tools: phpunit:10

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Execute PHPUnit tests
        run: phpunit --configuration phpunit.xml --colors=always --testdox

  php-codesniffer:
    name: PHP CodeSniffer (PSR-12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-user
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpcs

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHP CodeSniffer
        run: |
          phpcs --standard=PSR12 --extensions=php --ignore=vendor/,runtime/,public/assets/ app/ tests/ || true
          phpcs --standard=PSR12 --extensions=php --ignore=vendor/,runtime/,public/assets/ app/ tests/

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify frontend-user static assets
        run: |
          echo "Checking frontend-user assets..."
          test -f frontend-user/public/assets/css/base.css || { echo "Missing base.css"; exit 1; }
          test -f frontend-user/public/assets/js/app.js || { echo "Missing app.js"; exit 1; }
          test -f frontend-user/public/index.php || { echo "Missing index.php"; exit 1; }
          echo "Frontend-user assets OK"

      - name: Verify frontend-admin static assets
        run: |
          echo "Checking frontend-admin assets..."
          test -f frontend-admin/public/assets/css/admin.css || { echo "Missing admin.css"; exit 1; }
          test -f frontend-admin/public/assets/js/admin.js || { echo "Missing admin.js"; exit 1; }
          test -f frontend-admin/public/index.php || { echo "Missing index.php"; exit 1; }
          echo "Frontend-admin assets OK"

      - name: Validate HTML templates
        run: |
          echo "Validating template files..."
          find frontend-user/app/view -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors"
          find frontend-admin/app/view -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors"
          echo "Template validation complete"

  docker-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [php-unit-test, php-codesniffer, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for frontend-user
        id: meta-user
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_USER }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend-user image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-user
          push: true
          tags: ${{ steps.meta-user.outputs.tags }}
          labels: ${{ steps.meta-user.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend-admin
        id: meta-admin
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_ADMIN }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend-admin image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-admin
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
