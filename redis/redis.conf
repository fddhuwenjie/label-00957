bind 0.0.0.0
port 6379

# 内存管理
maxmemory 2g
maxmemory-policy allkeys-lru

# 持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
aof-load-truncated yes

# RDB 持久化
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# 安全
rename-command CONFIG ""
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""

# 性能优化
tcp-backlog 511
timeout 0
tcp-keepalive 300
databases 16

# 慢日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 内存使用报告
latency-monitor-threshold 100

# 客户端连接
maxclients 10000
