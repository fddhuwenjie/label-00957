<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- 光年之外 - 邓紫棋 - 宇宙星空主题 -->
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0221"/>
      <stop offset="50%" style="stop-color:#1a0533"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6ec7;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ff6ec7;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg2)"/>
  <!-- 星云 -->
  <ellipse cx="100" cy="100" rx="70" ry="50" fill="url(#glow)"/>
  <!-- 星星 -->
  <circle cx="20" cy="20" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="60" cy="35" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="140" cy="20" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="180" cy="50" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="25" cy="80" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="175" cy="130" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="40" cy="160" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="160" cy="170" r="1" fill="#fff" opacity="0.5"/>
  <!-- 行星 -->
  <circle cx="100" cy="100" r="25" fill="#4a2c8a"/>
  <ellipse cx="100" cy="100" rx="45" ry="8" fill="none" stroke="#9b59b6" stroke-width="2" opacity="0.7" transform="rotate(-20,100,100)"/>
  <!-- 光线 -->
  <line x1="100" y1="100" x2="30" y2="30" stroke="#ff6ec7" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="100" x2="170" y2="40" stroke="#ff6ec7" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="100" x2="50" y2="170" stroke="#ff6ec7" stroke-width="0.5" opacity="0.3"/>
</svg>